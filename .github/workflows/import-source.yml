name: Загрузка исходников Mythoria
on:
  push:
    branches: [main]
    paths:
      - '.stage/source.b64'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать файлы проекта
        run: |
          base64 -d .stage/source.b64 > /tmp/mythoria-source.tar.xz
          tar -xJf /tmp/mythoria-source.tar.xz -C .
          rm -f .github/workflows/windows-build.yml
      - name: Сохранить исходники простыми коммитами
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py launcher.py characterlab database tests requirements.txt requirements-dev.txt run.bat run.command build_windows.bat mythoria.spec tools/start.py
          git commit -m "добавила генерацию и базу данных"
          git add templates static
          git commit -m "оформила страницы и карусель"
          git add -A
          git commit -m "добавила схемы и инструкции"
          rm .stage/source.b64
          git add -u .stage/source.b64
          git commit -m "убрала временный файл"
          git push origin HEAD:main
