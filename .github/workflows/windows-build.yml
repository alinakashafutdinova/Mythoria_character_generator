name: Сборка Mythoria для Windows
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'templates/**'
      - 'static/**'
      - 'database/**'
      - 'requirements*.txt'
      - 'mythoria.spec'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить библиотеки
        run: python -m pip install -r requirements-dev.txt
      - name: Проверить проект
        run: python -m pytest -q
      - name: Собрать программу
        run: python -m PyInstaller --noconfirm mythoria.spec
      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: Mythoria-Windows
          path: dist/Mythoria/
