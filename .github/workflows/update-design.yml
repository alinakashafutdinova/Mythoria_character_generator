name: Обновление оформления Mythoria
on:
  push:
    branches: [main]
    paths:
      - '.stage/design.b64'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать исходники
        run: |
          base64 -d .stage/design.b64 > /tmp/mythoria-design.tar.xz
          tar -xJf /tmp/mythoria-design.tar.xz -C .
      - name: Сохранить дизайн в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/base.html templates/index.html static/css/design.css static/js/app.js static/images/mythoria-mark.svg static/images/favicon.svg
          git commit -m "оформила главную страницу по макету"
          git rm -f .stage/design.b64 static/css/brand.css
          git commit -m "убрала временные файлы"
          git push origin HEAD:main
