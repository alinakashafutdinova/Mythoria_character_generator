{% extends 'base.html' %}{% block title %}Редактирование{% endblock %}
{% block content %}<div class="breadcrumbs"><a href="{{ url_for('detail',cid=item.id) }}">← Вернуться к персонажу</a></div><div class="page-top"><p class="eyebrow">РЕДАКТИРОВАНИЕ</p><h1>{{ item.name }}</h1></div>
<div class="panel edit-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label for="name">Имя</label><input id="name" name="name" maxlength="80" required value="{{ request.form.get('name',item.name) }}"><label for="bio">История персонажа</label><textarea id="bio" name="bio" rows="4" maxlength="1000">{{ request.form.get('bio',item.bio) }}</textarea><h2>Характеристики</h2><div class="edit-stats">{% for s in stats %}<label>{{ s.label }}<input type="number" name="stat_{{ s.id }}" min="{{ s.min_value }}" max="{{ s.max_value }}" value="{{ request.form.get('stat_' ~ s.id,s.value) }}" required></label>{% endfor %}</div><div class="actions"><button class="button primary" type="submit">Сохранить изменения</button><a href="{{ url_for('detail',cid=item.id) }}" class="button ghost">Отмена</a></div></form></div>
{% endblock %}
